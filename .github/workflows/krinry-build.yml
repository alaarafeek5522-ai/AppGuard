name: AppGuard Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options: [debug, release]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: 'stable'

      - name: Setup keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks
          cat > android/key.properties << 'KEYEOF'
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          KEYEOF

      - name: Pub get
        run: flutter pub get

      - name: Create android folder
        run: flutter create --platforms android .

      - name: Copy MainActivity
        run: |
          cp android_plugin/MainActivity.kt \
            android/app/src/main/kotlin/com/alaa/appguard/MainActivity.kt

      - name: Build with obfuscation
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            flutter build apk --release \
              --obfuscate \
              --split-debug-info=build/debug-info
          else
            flutter build apk --debug
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: appguard-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7
